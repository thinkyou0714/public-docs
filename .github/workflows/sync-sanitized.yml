name: Sync Sanitized Snapshots

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Tenant folder under obsidian-sync/10_sanitized"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - tenant-a
          - tenant-b
      apply:
        description: "Apply changes to content files"
        required: true
        default: false
        type: boolean
      auto_commit:
        description: "Commit and push changes (requires apply=true)"
        required: true
        default: false
        type: boolean
      fail_on_dod_drop:
        description: "Fail run if changed article DoD is not 10/10"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Run sanitized sync
    runs-on: ubuntu-latest
    environment: sync-${{ inputs.tenant_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync (dry-run or apply)
        run: |
          SAN_DIR="obsidian-sync/10_sanitized/${{ inputs.tenant_id }}"
          if [ ! -d "$SAN_DIR" ]; then
            echo "[ERROR] sanitized tenant directory not found: $SAN_DIR"
            exit 1
          fi
          if [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/sync-sanitized.mjs --apply --sanitized-dir "$SAN_DIR"
          else
            node scripts/sync-sanitized.mjs --sanitized-dir "$SAN_DIR"
          fi

      - name: Validate secrets
        if: ${{ inputs.apply == true }}
        run: npm run check-secrets

      - name: Validate build
        if: ${{ inputs.apply == true }}
        run: npm run build

      - name: Append sync audit log
        if: ${{ inputs.apply == true }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/append-sync-audit.mjs \
            --file docs/sync-audit-log.md \
            --tenant "${{ inputs.tenant_id }}" \
            --mode "apply" \
            --actor "${{ github.actor }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --sha "${{ github.sha }}"

      - name: Write diff summary (no auto-commit)
        id: diff_summary
        if: ${{ inputs.apply == true && inputs.auto_commit == false }}
        run: |
          echo "dod_drop=false" >> "$GITHUB_OUTPUT"
          echo "changed_files=none" >> "$GITHUB_OUTPUT"
          echo "content_files=none" >> "$GITHUB_OUTPUT"
          echo "other_files=none" >> "$GITHUB_OUTPUT"
          echo "content_count=0" >> "$GITHUB_OUTPUT"
          echo "other_count=0" >> "$GITHUB_OUTPUT"
          echo "## Sync Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tenant: \`${{ inputs.tenant_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`apply\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto commit: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t CHANGED_ALL < <(git diff --name-only)
          mapfile -t CHANGED_CONTENT < <(printf '%s\n' "${CHANGED_ALL[@]}" | grep '^content/' || true)
          mapfile -t CHANGED_OTHER < <(printf '%s\n' "${CHANGED_ALL[@]}" | grep -v '^content/' || true)

          PRIORITIZED=("${CHANGED_CONTENT[@]}" "${CHANGED_OTHER[@]}")
          CHANGED_FILES=()
          for f in "${PRIORITIZED[@]}"; do
            [ -n "$f" ] || continue
            CHANGED_FILES+=("$f")
            if [ "${#CHANGED_FILES[@]}" -ge 20 ]; then
              break
            fi
          done

          CHANGED_CONTENT_LIMITED=()
          for f in "${CHANGED_CONTENT[@]}"; do
            [ -n "$f" ] || continue
            CHANGED_CONTENT_LIMITED+=("$f")
            if [ "${#CHANGED_CONTENT_LIMITED[@]}" -ge 20 ]; then
              break
            fi
          done

          CHANGED_OTHER_LIMITED=()
          for f in "${CHANGED_OTHER[@]}"; do
            [ -n "$f" ] || continue
            CHANGED_OTHER_LIMITED+=("$f")
            if [ "${#CHANGED_OTHER_LIMITED[@]}" -ge 20 ]; then
              break
            fi
          done
          {
            echo "changed_files<<EOF"
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "EOF"
            echo "content_files<<EOF"
            printf '%s\n' "${CHANGED_CONTENT_LIMITED[@]}"
            echo "EOF"
            echo "other_files<<EOF"
            printf '%s\n' "${CHANGED_OTHER_LIMITED[@]}"
            echo "EOF"
            echo "content_count=${#CHANGED_CONTENT[@]}"
            echo "other_count=${#CHANGED_OTHER[@]}"
          } >> "$GITHUB_OUTPUT"
          echo "### Changed Files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git status --short | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Diff Stat" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### DoD Status (Changed Articles)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t CHANGED_MDX < <(git diff --name-only -- 'content/**/*.mdx')
          if [ "${#CHANGED_MDX[@]}" -eq 0 ]; then
            echo "No changed article files." >> "$GITHUB_STEP_SUMMARY"
          else
            DOD_EXIT=0
            if [ "${{ inputs.fail_on_dod_drop }}" = "true" ]; then
              node scripts/dod-evaluate.mjs --exit-on-needs-review "${CHANGED_MDX[@]}" >> "$GITHUB_STEP_SUMMARY" || DOD_EXIT=$?
            else
              node scripts/dod-evaluate.mjs "${CHANGED_MDX[@]}" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$DOD_EXIT" -ne 0 ]; then
              echo "dod_drop=true" >> "$GITHUB_OUTPUT"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo ":x: Workflow failed because \`fail_on_dod_drop=true\` and DoD dropped below 10/10." >> "$GITHUB_STEP_SUMMARY"
              exit "$DOD_EXIT"
            fi
          fi

      - name: Create issue on DoD drop
        if: ${{ always() && inputs.apply == true && inputs.auto_commit == false && inputs.fail_on_dod_drop == true && steps.diff_summary.outputs.dod_drop == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tenant = '${{ inputs.tenant_id }}';
            const label = 'sync-dod-drop';
            const title = `[DoD Drop][${tenant}] Manual sync requires article review`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const contentRaw = `${{ steps.diff_summary.outputs.content_files }}`.trim();
            const otherRaw = `${{ steps.diff_summary.outputs.other_files }}`.trim();
            const contentFiles = contentRaw && contentRaw !== 'none'
              ? contentRaw.split('\n').filter(Boolean)
              : [];
            const otherFiles = otherRaw && otherRaw !== 'none'
              ? otherRaw.split('\n').filter(Boolean)
              : [];
            const contentCount = Number(`${{ steps.diff_summary.outputs.content_count }}` || '0');
            const otherCount = Number(`${{ steps.diff_summary.outputs.other_count }}` || '0');
            const changedSection = contentFiles.length > 0 || otherCount > 0
              ? [
                  '',
                  '### Changed Files (content priority, up to 20 each group)',
                  ...(contentFiles.length > 0
                    ? ['#### content/**', ...contentFiles.map((f) => `- \`${f}\``)]
                    : ['#### content/**', '- none']),
                  ...(otherCount > 0
                    ? [
                        '',
                        `<details><summary>other files: ${otherCount}</summary>`,
                        '',
                        ...otherFiles.map((f) => `- \`${f}\``),
                        '</details>',
                      ]
                    : []),
                ].join('\n')
              : '';

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'B60205',
                  description: 'DoD dropped below 10/10 during manual sync run',
                });
              } else {
                throw e;
              }
            }

            const commentBody = [
              '## DoD Gate Failed (New Run)',
              '',
              `- Tenant: \`${tenant}\``,
              '- Condition: `fail_on_dod_drop=true`',
              `- Run: ${runUrl}`,
              `- Actor: @${context.actor}`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              changedSection,
              '',
              'Please review changed articles and restore DoD 10/10 before rerun.',
            ].join('\n');

            // Deduplicate by tenant open issue: append comment instead of creating new issue.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const duplicate = openIssues.find((i) => i.title.includes(`[DoD Drop][${tenant}]`));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: duplicate.number,
                body: commentBody,
              });
              core.info(`Existing open issue found: #${duplicate.number}. Added comment.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body: commentBody,
              labels: [label],
            });
            core.info(`Created issue #${created.data.number}`);

      - name: Commit changes
        if: ${{ inputs.apply == true && inputs.auto_commit == true }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/**/*.mdx public/sitemap.xml docs/sync-audit-log.md
          git commit -m "chore: sync sanitized snapshots via workflow" -m "tenant=${{ inputs.tenant_id }}"
          git push
