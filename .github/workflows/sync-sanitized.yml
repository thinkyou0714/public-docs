name: Sync Sanitized Snapshots

on:
  workflow_dispatch:
    inputs:
      sanitized_dir:
        description: "Path containing *-sanitized.md files"
        required: true
        default: "obsidian-sync/10_sanitized"
        type: string
      apply:
        description: "Apply changes to content files"
        required: true
        default: false
        type: boolean
      auto_commit:
        description: "Commit and push changes (requires apply=true)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    name: Run sanitized sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync (dry-run or apply)
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/sync-sanitized.mjs --apply --sanitized-dir "${{ inputs.sanitized_dir }}"
          else
            node scripts/sync-sanitized.mjs --sanitized-dir "${{ inputs.sanitized_dir }}"
          fi

      - name: Validate secrets
        if: ${{ inputs.apply == true }}
        run: npm run check-secrets

      - name: Validate build
        if: ${{ inputs.apply == true }}
        run: npm run build

      - name: Commit changes
        if: ${{ inputs.apply == true && inputs.auto_commit == true }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/**/*.mdx public/sitemap.xml
          git commit -m "chore: sync sanitized snapshots via workflow"
          git push
