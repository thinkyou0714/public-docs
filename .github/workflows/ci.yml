name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify static output
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          file_count="$(find out -name "*.html" | wc -l)"
          echo "Generated ${file_count} HTML files"
          test "${file_count}" -gt 0
